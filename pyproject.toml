[project]
name = "nju-badminton-ocr"
version = "0.1.0"
description = "Local OCR dependencies for the NJU badminton booking script"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ddddocr==1.6.1",
    "numpy==2.2.6",
    "onnxruntime==1.23.2",
    "opencv-python==5.0.0.93; sys_platform == 'win32'",
    "opencv-python-headless==5.0.0.93; sys_platform == 'linux'",
    "pillow==12.3.0",
]

[tool.uv]
package = false
